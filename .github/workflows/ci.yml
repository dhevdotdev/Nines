name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Format and static analysis
        run: ./gradlew spotlessCheck :app:detekt
      - name: Unit tests and scoring coverage floor
        run: ./gradlew :app:testDebugUnitTest :app:jacocoDebugUnitTestCoverageVerification
      - name: Lint, debug build, instrumented-test compile
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:compileDebugAndroidTestKotlin
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest
          retention-days: 14
